# StructAI Vision — infraestrutura completa (Sessão 1)
# Subir:  docker compose -f infra/docker-compose.yml up --build
# Regra de ouro: ferramentas externas entram como IMAGEM (dependência), nunca
# como código copiado. ODM = serviço NodeODM; o backend fala com ele via API.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: structai
      POSTGRES_PASSWORD: structai
      POSTGRES_DB: structai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U structai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: structai
      MINIO_ROOT_PASSWORD: structai123
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - miniodata:/data

  nodeodm:
    # Reconstrução 3D. Com GPU NVIDIA, troque para opendronemap/nodeodm:gpu
    # e descomente o bloco `deploy` — sem GPU o processamento é MUITO mais lento
    # (risco 2.3 do roadmap).
    image: opendronemap/nodeodm:latest
    ports:
      - "3000:3000"
    volumes:
      - odmdata:/var/www/data
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build: ../backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    env_file: ../.env
    depends_on:
      - backend
      - nodeodm

volumes:
  pgdata:
  miniodata:
  odmdata:
